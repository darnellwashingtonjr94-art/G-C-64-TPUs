apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-g-c-64-tpus
  namespace: default
  labels:
    grafana_dashboard: "1"
data:
  tpu-observability.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "TPU Core Utilization Rate",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(tpu_core_utilization_total[5m])",
              "legendFormat": "Instance {{ instance }}"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "title": "KServe Inference P99 Latency",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{service=\"g-c-64-tpus-inference\"}[5m]))",
              "legendFormat": "P99 Latency"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["tpus", "mlops", "gke"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "G-C-64-TPUs Operational Dashboard",
      "uid": "g-c-64-tpus-dash",
      "version": 1,
      "weekStart": ""
    }
