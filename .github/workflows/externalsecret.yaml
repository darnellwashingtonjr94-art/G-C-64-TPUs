apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tpu-model-credentials
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: model-api-secret
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: production-model-api-key
        property: latest
