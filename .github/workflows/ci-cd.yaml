name: G-C-64-TPUs MLOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central2
  REPOSITORY: g-c-64-tpus-repo
  IMAGE: g-c-64-tpus

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Authenticate to GKE Cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: g-c-64-tpus-cluster
          location: ${{ env.REGION }}

      - name: Trigger ArgoCD Sync / Apply Manifests
        run: |
          echo "Updating deployment image references..."
          sed -i 's|image: .*/g-c-64-tpus:latest|image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}|g' raycluster-tpu.yaml
          sed -i 's|image: .*/g-c-64-tpus:latest|image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}|g' workflow.yaml
          
          echo "Applying infrastructure updates..."
          kubectl apply -f raycluster-tpu.yaml
          kubectl apply -f inferenceservice.yaml
          
          echo "Verifying rollout status..."
          kubectl rollout status deployment/mlflow-tracking-server --timeout=120s
