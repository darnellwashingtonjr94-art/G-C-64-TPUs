apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: g-c-64-tpus-isolation
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: g-c-64-tpus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from the Istio ingress gateway or monitoring system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow essential DNS resolution and cluster-internal communication
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow communication to external model registries or storage if needed
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
